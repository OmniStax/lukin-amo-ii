<section id="adiabatic-processes">
<p>到目前为止，我们的讨论一直集中在理解<span data-concept="hamiltonian">哈密顿量</span>在适当的<span data-concept="rotating-frame">转动参考系</span>中不含时的系统动力学上。遇到含时项时，例如整形外加激光脉冲的<span data-concept="slowly-varying-envelope">包络</span>，我们曾论证，系统应当可以用一个恒定的<span data-concept="hamiltonian">哈密顿量</span>相当好地描述，其中含有缓变参量的瞬时值。在本章中，我们将把这一直觉置于更为形式化的基础之上，并讨论其适用范围的限度。</p>
