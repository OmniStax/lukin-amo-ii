<section id="atomic-motion-in-laser-light">
<p>除内部能级结构之外，原子还具有与其质心运动相对应的外部自由度。由于光子携带能量和动量，原子与光的相互作用既能影响原子的电子态，也能影响原子的运动态。利用原子运动的<span data-concept="semiclassical-light-force">半经典</span>图像，我们将说明激光如何既能对原子产生<span data-concept="dissipative-force">耗散</span>力，也能产生保守力。<span data-concept="dipole-force">保守力</span>将借助<span data-concept="dressed-states">缀饰</span>原子能级来解释和诠释，而<span data-concept="dissipative-force">耗散力</span>则可以从非相干抽运率和阻尼率的角度来理解。</p>
</section>
