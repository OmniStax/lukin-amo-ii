<section id="quantum-dynamics-of-atomic-matter-waves">
<p>我们先前的讲义集中于光波的量子性质；现在转向物质场的量子性质。在对原子物理的讨论中，我们已经讨论过<span data-concept="laser-cooling">利用光力冷却原子</span>的技术。然而，随着原子温度趋近于零，原子的量子统计变得越来越重要。当一个无相互作用、不受束缚的玻色子系综被冷却到$T \rightarrow 0$时，宏观数量的原子占据基态。<span data-concept="laser-cooling">激光冷却</span>和陷俘技术的进步，使实验得以探测原子气体的这种量子简并态。对于玻色原子，这类状态中最突出的例子是<span data-concept="bose-condensation">玻色-爱因斯坦凝聚体（BEC）</span>。</p>
</section>
